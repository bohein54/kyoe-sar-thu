<script>
let isLockedBySystem = true;
let currentPage = 0;
let currentMonthData = [];

function getStorageKey(month){

  return "KYOE_SAR_THU_" + month;
}

function initApp() {
  // ၁။ ⚙️ CONFIG Settings ပြန်လည်ရယူခြင်း
  let savedConfig = localStorage.getItem("KST_CONFIG");
  if(savedConfig) {
    CONFIG = JSON.parse(savedConfig);
    if(document.getElementById("cfgDayPay")) document.getElementById("cfgDayPay").value = CONFIG.dayPay;
    if(document.getElementById("cfgOtPay")) document.getElementById("cfgOtPay").value = CONFIG.otPayRate;
    if(document.getElementById("cfgStartDay")) document.getElementById("cfgStartDay").value = CONFIG.salaryStartDay;
  }
  
  // ၂။ 🌓 Theme ပြန်လည်ရယူခြင်း
  if(localStorage.getItem("KST_THEME") === "light") {
    document.body.classList.add("light-theme");
  } else {
    document.body.classList.remove("light-theme");
  }
  
  // ၃။ 📸 Profile ပုံ ပြန်လည်ရယူခြင်း
  let savedPic = localStorage.getItem("KST_PROFILE_PIC");
  if(savedPic) {
    if(document.getElementById("modalProfilePic")) document.getElementById("modalProfilePic").src = savedPic;
    if(document.getElementById("topNavProfilePic")) document.getElementById("topNavProfilePic").src = savedPic;
  }

  // ၄။ 📅 လရွေးချယ်ရန် Dropdown (January to December) ကို ဒေတာထည့်ခြင်း
  let monthView = document.getElementById("monthView");
  if(monthView) {
    monthView.innerHTML = "";
    let months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
    
    months.forEach(mName => {
      let opt = document.createElement("option");
      opt.value = mName; 
      opt.text = mName; 
      monthView.appendChild(opt);
    });
    
    // လက်ရှိ ရောက်နေတဲ့လကို Auto ရွေးပေးထားမည်
    monthView.value = months[new Date().getMonth()];
  }

  // ၅။ ⏰ Entry Form ထဲက Date Input ကို ယနေ့ရက်စွဲ Auto ချိန်ပေးခြင်း
  if(document.getElementById("date")) {
    document.getElementById("date").value = new Date().toISOString().split('T')[0];
  }

  // ၆။ Login Status ကို စစ်ဆေးခြင်း
  checkLogin(); 
}

function switchTab(tab) {
  // ရှိပြီးသား Tab active ကုဒ်များ...
  
  // 🎯 Entry Page မှာ အောက်က Pagination ခလုတ်များ ဖျောက်ထားရန် Logic
  let paginationRow = document.getElementById("prevBtn").parentElement; // ခလုတ်များပါသော Container div
  if (paginationRow) {
    if (tab === 'entry') {
      paginationRow.style.display = "none";
    } else {
      paginationRow.style.display = "flex";
    }
  }
}
// ==========================================
// ⚙️ NEW FEATURES SETTINGS LOGIC 
// ==========================================

let CONFIG = { dayPay: 400, otPayRate: 50, salaryStartDay: 21 };

// 1️⃣ & 2️⃣ Configuration Save Settings
function saveSettings() {
  CONFIG.dayPay = parseFloat(document.getElementById("cfgDayPay").value) || 400;
  CONFIG.otPayRate = parseFloat(document.getElementById("cfgOtPay").value) || 50;
  CONFIG.salaryStartDay = parseInt(document.getElementById("cfgStartDay").value) || 21;
  localStorage.setItem("KST_CONFIG", JSON.stringify(CONFIG));
  showToast("⚙️ Settings ပြင်ဆင်မှု သိမ်းဆည်းပြီးပါပြီ");
  calculate(); 
  renderTable();
}
// 3️⃣ Forgot Password Alert Trigger
function forgotPassword() {
  alert("🔑 Password ပြန်လည်ရယူရန်အတွက် Developer 'Bo Hein' သို့ တိုက်ရိုက်ဆက်သွယ်ပြီး Master Key တောင်းခံပေးပါဗျာ။");
}

// 4️⃣ Profile Picture Upload & Save LocalStorage
function uploadProfilePic(input) {
  if (input.files && input.files[0]) {
    let reader = new FileReader();
    reader.onload = function(e) {
      let base64Img = e.target.result;
      localStorage.setItem("KST_PROFILE_PIC", base64Img);
      
      // နေရာအားလုံးတွင် ပုံတစ်ခါတည်း ပြောင်းလဲခြင်း
      if(document.getElementById("modalProfilePic")) document.getElementById("modalProfilePic").src = base64Img;
      if(document.getElementById("topNavProfilePic")) document.getElementById("topNavProfilePic").src = base64Img;
      
      showToast("📸 Profile ပုံ ပြောင်းလဲပြီးပါပြီဗျာ");
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// 5️⃣ Dark / Light Theme Toggler Logic
function toggleTheme() {
  if(document.body.classList.contains("light-theme")) {
    document.body.classList.remove("light-theme");
    localStorage.setItem("KST_THEME", "dark");
    showToast("🌙 Dark Theme သို့ ပြောင်းလိုက်ပါပြီ");
  } else {
    document.body.classList.add("light-theme");
    localStorage.setItem("KST_THEME", "light");
    showToast("☀️ Light Theme သို့ ပြောင်းလိုက်ပါပြီ");
  }
}

async function loginAccount(){
  let email = document.getElementById("userEmail").value.trim();
  let password = document.getElementById("userPassword").value.trim();

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showToast(error.message, "error");
    return;
  }

  document.getElementById("accountStatus").innerHTML = "✅ Account Login ဝင်ထားသည်";
  document.getElementById("accountEmail").innerHTML = data.user.email;
  document.getElementById("authInputs").style.display = "none";

  showToast("Login Success - ဝင်ရောက်မှု အောင်မြင်ပါသည်");
  
  // ဒေတာများ ချက်ချင်း ဆွဲတင်မည်
  loadData();

  // ၁ စက္ကန့်အကြာတွင် Popup Box ကို အလိုအလျောက် ပိတ်ပေးမည်
  setTimeout(() => {
    closeProfile();
  }, 1000);
}
  
async function checkAccount(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  let user = session?.user;

  if(user){

    alert(
      "Login ဝင်ထားသည်\n\n" +
      user.email
    );

  }else{

    alert(
      "Login မဝင်ရသေးပါ"
    );

  }

}
  
async function openProfile(){
  document.getElementById("profilePage").style.display="flex"; // တိုင်ပင်ညှိထားတဲ့ Flex ဒီဇိုင်းအတိုင်း ပွင့်ရန်

  const { data:{user} } = await supabaseClient.auth.getUser();

  if(user){
    document.getElementById("accountStatus").innerHTML = "✅ Login ဝင်ထားသည်";
    document.getElementById("accountEmail").innerHTML = user.email;
    document.getElementById("authInputs").style.display = "none";
    
    // 👤 ပရိုဖိုင်ဖွင့်လိုက်ရင် အကောင့်ဝင်ထားကြောင်း Noti ပြပေးမည်
    showToast("အကောင့်ဝင်ရောက်ထားပြီးသားဖြစ်သည်");
  } else {
    document.getElementById("accountStatus").innerHTML = "❌ Account Login မဝင်ထားပါ";
    document.getElementById("accountEmail").innerHTML = "";
    document.getElementById("authInputs").style.display = "block";
    
    // အကောင့်မဝင်ရသေးရင် သတိပေး Noti ပြမည်
    showToast("Login မဝင်ရသေးပါ၊ ဝင်ရောက်ပေးပါ", "error");
  }
}
function closeProfile(){

document.getElementById(
"profilePage"
).style.display="none";

}

async function logoutAccount(){
  // ၁။ Supabase ကနေ အကောင့် Logout ထွက်မယ်
  await supabaseClient.auth.signOut();

  // ၂။ လက်ရှိ သိမ်းထားတဲ့ ဒေတာတွေကို အကုန် ရှင်းပစ်မယ်
  currentMonthData = [];

  // ၃။ Noti ပြပြီး ပရိုဖိုင် Box ကို ပိတ်မယ်
  showToast("Logout Success");
  closeProfile();

  // ၄။ ဒေတာဇယားကို အလွတ်ပုံစံ (အကောင့်ဝင်ရန် စာတန်း) ပြန်ပြောင်းခိုင်းမယ်
  renderTable();
}
  
function checkLogin(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user === "Bo hein" && pass === "000000"){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("mainApp").classList.remove("hidden");

    // အထဲရောက်ရင် Supabase Login ရှိမရှိ စစ်ဆေးပြီး ဒေတာဆွဲပါမယ်
    checkInitialAuth();
  }else{
    showToast("Password မှားနေပါတယ်", "error");
  }
}

// အထဲရောက်ရင် အကောင့်ဝင်ထားပြီးသားလား ကြိုစစ်ပေးမည့် Function
async function checkInitialAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    loadData();
  } else {
    // အကောင့်မဝင်ရသေးရင် ဒေတာဇယားကို အလွတ်ပဲ ပြထားမယ်
    currentMonthData = [];
    renderTable();
    // လူကြီးမင်းတို့ စိတ်ကြိုက် Profile ဖွင့်ခိုင်းချင်ရင် openProfile() ကို ဒီမှာ လှမ်းခေါ်နိုင်ပါတယ်
  }
}

function showToast(message, type = "success") {
  const toast = document.getElementById("toast");
  if (!toast) return;

  toast.innerHTML = message;

  // အောင်မြင်မှု သို့မဟုတ် အမှားအယွင်းအလိုက် ခေတ်မီပြီး လင်းလက်သော အရောင်များ ပြောင်းလဲခြင်း
  if (type === "error") {
    // အနီရောင် Glow ဒီဇိုင်း
    toast.style.background = "linear-gradient(135deg, #ef4444, #b91c1c)";
    toast.style.boxShadow = "0 10px 25px rgba(239, 68, 68, 0.4)";
    toast.style.border = "1px solid rgba(255, 255, 255, 0.2)";
  } else {
    // အစိမ်းရောင် Glow ဒီဇိုင်း
    toast.style.background = "linear-gradient(135deg, #10b981, #047857)";
    toast.style.boxShadow = "0 10px 25px rgba(16, 185, 129, 0.4)";
    toast.style.border = "1px solid rgba(255, 255, 255, 0.2)";
  }

  // Noti ကို ပြသခြင်း
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  // ၂.၅ စက္ကန့်ပြည့်လျှင် အပေါ်သို့ ပြန်လည် လျှောတက် ပျောက်ကွယ်သွားမည်
  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

function calculate(){
   let endTime = document.getElementById("endTime").value;
  let startTime = document.getElementById("startTime");
  let resOt = document.getElementById("resOt");
  let resTotal = document.getElementById("resTotal");

  // Auto Start Time
  if(endTime === "OFF DAY"){
    startTime.value = "အလုပ်ပိတ်ရက်";
    resOt.innerText="0 hr";
    resTotal.innerText="฿0.00";
    return;
  }
   startTime.value = "08:00 AM";
  
  if(endTime === "12:00 PM"){
    resOt.innerText = "0 hr"; 
    resTotal.innerText = "฿" + (CONFIG.dayPay / 2).toFixed(2); 
    return;
  }

  let map = {"05:00 PM":9, "06:00 PM":10, "07:00 PM":11, "08:00 PM":12, "09:00 PM":13, "10:00 PM":14};
  let hrs = map[endTime] || 9;
  let ot = hrs > 9 ? hrs - 9 : 0;

  // ပြောင်းလဲထားတဲ့ CONFIG Settings အတိုင်း dynamic ပြန်ပြပေးမည့် နေရာအမှန်
  resOt.innerText = ot + " hr";
  resTotal.innerText = "฿" + (CONFIG.dayPay + ot * CONFIG.otPayRate).toFixed(2);
}
  
async function loadData(keepPage = false){
  let oldPage = currentPage;
  let month = document.getElementById("monthView").value;

  // လက်ရှိ Supabase အကောင့် ဝင်ထားသူကို စစ်မယ်
  const { data: { user } } = await supabaseClient.auth.getUser();
  
  // အကောင့်မဝင်ရသေးရင် ဒေတာလုံးဝမဆွဲဘဲ ဇယားကို အလွတ်ပဲ ပြထားမယ် (Error မပြတော့ပါ)
  if (!user) {
    currentMonthData = [];
    renderTable();
    return;
  }

  // အကောင့်ရှိမှ မိမိ user_id နဲ့ သက်ဆိုင်တဲ့ ဒေတာကို ဆွဲမယ်
  const { data, error } = await supabaseClient
    .from("salary_data")
    .select("*")
    .eq("user_id", user.id)
    .order("data", { ascending:true });
  currentMonthData = data || [];

  if(error){
    console.log(error);
    showToast("Load Error", "error");
    return;
  }

 let start = currentPage * 14;
  let page = currentMonthData.slice(start, start + 14);

  if(keepPage){
    currentPage = oldPage;
  }else{
    currentPage = 0;
  }

  renderTable();
}

  
function renderTable() {
  let tOt = 0, tPay = 0;
  let tbody = document.getElementById("dataTableBody");
  if (!tbody) return;
  tbody.innerHTML = "";

  // 1. ဒေတာမရှိရင် (သို့မဟုတ်) အကောင့်မဝင်ရသေးရင် LIST ဇယားထဲမှာ စာသားပြမည်
  if (!currentMonthData || currentMonthData.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding: 40px 10px; color: #9ca3af; text-align: center; font-style: italic;">
          🛈 ဒေတာများကြည့်ရှုရန် ပရိုဖိုင် (👤) တွင် အကောင့်ဝင်ပေးပါ
        </td>
      </tr>
    `;
    document.getElementById("total14Ot").innerText = "0 hr";
    document.getElementById("total14Pay").innerText = "฿0.00";
    document.getElementById("dateRangeDisplay").innerText = "ရက်စွဲ - (ဒေတာမှတ်တမ်း မရှိသေးပါ)";
    document.getElementById("pageInfo").innerText = "PAGE 1 (0 ခု)";
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    if(document.getElementById("tableLockOverlay")) {
      document.getElementById("tableLockOverlay").style.display = "none";
    }
    return; 
  }

  // ဒေတာများကို ရက်စွဲအလိုက် အရင်ဆုံး အစဉ်လိုက် (Ascending) စီပေးရပါမယ်
  currentMonthData.sort((a, b) => new Date(a.data[0]) - new Date(b.data[0]));

  // စတင်ရမည့် စာမျက်နှာအမှတ်ကို သတ်မှတ်မယ်
  let start = currentPage * 14;
  let page = currentMonthData.slice(start, start + 14);
 
  // ရက်စွဲခေါင်းစဉ်ပြပေးမည့် Logic
  if (page.length > 0) {
    let firstDate = page[0].data[0];
    let lastDate = page[page.length - 1].data[0];
    document.getElementById("dateRangeDisplay").innerHTML = 
      "  " + firstDate + " <span style='-webkit-text-fill-color: #9ca3af;'>➔</span> " + lastDate;
  }

  // ဇယားကွက် Row များ ထုတ်ပေးခြင်း Loop
  page.forEach(it => {
    let r = it;
    let otValue = parseFloat(r.ot_hours) || 0;
    let payStr = r.daily_pay ? r.daily_pay.toString() : "0";
    let payValue = parseFloat(payStr.replace('฿', '').replace(',', '')) || 0;

    let otDisplay, payDisplay, rowStyle;

let dayName = "";

if(r.data){
  let d = new Date(r.data);

  let days = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
  ];

  dayName = days[d.getDay()];
}
    
    if (r[2] === "OFF DAY" ) {
      otDisplay = "OFF DAY";
      payDisplay = "အလုပ်ပိတ်ရက်";
      rowStyle = "color: #ffffff; font-style: normal;";
    } else {
      tOt += otValue;
      tPay += payValue;
      otDisplay = r.ot_hours + " hr";
      payDisplay = r.daily_pay;
      rowStyle = "color: #facc15; font-weight: bold;";
    }

    // Dash border များဖျောက်ထားပြီး သပ်ရပ်သွားသော ဇယားကွက် Row UI
    tbody.innerHTML += `
      <tr style="border-bottom:1px solid #2ec4b6; ${rowStyle}">
        <td style="padding:8px; position:relative;">
          <<span onclick="this.nextElementSibling.click()" style="cursor:pointer;">${r.data}</span>
        <input type="date" value="${r.data}" 
                 style="display:none; background:#16213e; color:white; border:1px solid #2ec4b6; padding:2px; font-size:11px; rounded:4px;"
                 onchange="updateCell(${it.rowIndex}, 0, this.value)">
        </td>
        
<td style="padding:8px;">${dayName}</td>
         
      <td style="padding:8px;">
        <span contenteditable="true" 
              inputmode="decimal"
              style="display:inline-block; min-width:25px; outline:none;"
                onkeypress="if(event.which==32 || event.which==13) { event.preventDefault(); this.blur(); return false; }"
                onblur="updateCell(${it.rowIndex}, 4, this.innerText)">${r.ot_hours}</span> hr
        </td>
         <td style="padding:8px;">${payDisplay}</td>
      <td style="padding:8px;">
          <button style="color:#ff4d6d; font-size:13px;" onclick="del(${it.rowIndex})">✕</button>
        </td>
      </tr>`;
  });

   document.getElementById("total14Ot").innerText = tOt + " hr";
  document.getElementById("total14Pay").innerText = "฿" + tPay.toFixed(2);

  // စာမျက်နှာ အချက်အလက်
  document.getElementById("pageInfo").innerText = "PAGE " + (currentPage + 1) + "  (" + page.length + " ခု)";

  document.getElementById("prevBtn").disabled = (currentPage === 0);
  document.getElementById("nextBtn").disabled = ((currentPage + 1) * 14 >= currentMonthData.length);
  applyLockUI();
}

  
function applyLockUI(){

  let lockOverlay =
  document.getElementById("tableLockOverlay");

  if(!lockOverlay) return;

  let currentPageData =
  currentMonthData.slice(
    currentPage * 14,
    currentPage * 14 + 14
  );

  // ၁၄ရက်ပြည့်မှ lock ခတ်
  if(currentPageData.length >= 14){

    if(isLockedBySystem){
      lockOverlay.style.display = "flex";
    }else{
      lockOverlay.style.display = "none";
    }

  }else{
    lockOverlay.style.display = "none";
  }
}
function handleTableDoubleClick(){

  let currentPageData =
  currentMonthData.slice(
    currentPage * 14,
    currentPage * 14 + 14
  );

  // ၁၄ရက်မပြည့်ရင် မခတ်
  if(currentPageData.length < 14) return;

  isLockedBySystem = !isLockedBySystem;

  applyLockUI();

  if(isLockedBySystem){
    showToast("lock ခတ်လိုက်ပါပြီ","error");
  }else{
    showToast("Lock ဖြုတ်ပြီးပါပြီ");
  }
}

function changePage(step){

  let maxPage =
  Math.ceil(currentMonthData.length / 14) - 1;

  currentPage += step;

  if(currentPage < 0) currentPage = 0;
  if(currentPage > maxPage) currentPage = maxPage;

  isLockedBySystem = true;

  renderTable();
}


async function saveData(){
  const btn = document.getElementById("addBtn");
  btn.disabled = true;
  btn.innerText = "SAVING...";

  // ၁။ လက်ရှိ Login ဝင်ထားတဲ့ User ရဲ့ ID ကို ယူမယ်
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    showToast("ကျေးဇူးပြု၍ အရင် Login ဝင်ပါ", "error");
    btn.disabled = false;
    btn.innerText = "ADD RECORD";
    return;
  }

  let dateValue = document.getElementById("date").value;
  let startVal = document.getElementById("startTime").value;
  let endVal = document.getElementById("endTime").value;

  let map = { "05:00 PM":9, "06:00 PM":10, "07:00 PM":11, "08:00 PM":12, "09:00 PM":13, "10:00 PM":14 };
  let hrs = map[endVal] || 0;
  let isOff = endVal === "OFF DAY";
  let isHalf = endVal === "12:00 PM";
  let ot = hrs > 9 ? hrs - 9 : 0;
  let dailyPay = isOff ? 0 : (isHalf ? (CONFIG.dayPay / 2) : CONFIG.dayPay + ot * CONFIG.otPayRate);

  // duplicate check (မိမိအကောင့်ထဲမှာပဲ ဒီရက်စွဲ ရှိမရှိ စစ်တာဖြစ်လို့ .eq("user_id", user.id) ထည့်ရပါမယ်)
  const { data: oldData } = await supabaseClient
    .from("salary_data")
    .select("*")
    .eq("data", dateValue)
    .eq("user_id", user.id);

  if(oldData && oldData.length > 0){
    showToast("ဒီရက်စွဲရှိပြီးသား", "error");
    btn.disabled = false;
    btn.innerText = "ADD RECORD";
    return;
  }

  // ၂။ ဒေတာအသစ်သွင်းတဲ့နေရာမှာ user_id: user.id ကိုပါ ထည့်သွင်းသိမ်းဆည်းပါမယ်
  const { error } = await supabaseClient
    .from("salary_data")
    .insert([{
      user_id: user.id, // 👈 အရေးကြီးဆုံးအချက် - ဒါမှ ဘယ်သူ့ဒေတာလဲဆိုတာ မှတ်ထားမှာပါ
      data: dateValue,
      start_time: startVal,
      end_time: endVal,
      work_hours: isOff ? 0 : (isHalf ? 4 : hrs),
      ot_hours: isOff || isHalf ? 0 : ot,
      ot_pay: "฿" + (ot * CONFIG.otPayRate).toFixed(2),
      daily_pay: "฿" + dailyPay.toFixed(2)
    }]);

  btn.disabled = false;
  btn.innerText = "ADD RECORD";

  if(error){
    console.log(error);
    showToast("Database Save Error", "error");
    return;
  }
  showToast("သိမ်းဆည်းပြီးပါပြီ");
  loadData();
}
  

async function del(i){

if(confirm("Delete?")){

const { error } =
await supabaseClient
  .from("salary_data")
  .delete()
  .eq("id", i);

if(error){

  console.log(error);

  showToast(
    "Delete Error",
    "error"
  );

  return;
}

loadData();

}
}
async function updateCell(rowIndex, colIndex, newValue) {
  let updateData = currentMonthData.find(it => it.rowIndex === rowIndex);
  if (!updateData) return;

  // 1. DATE ပြင်ဆင်ခြင်း Logic
  if (colIndex === 0) {
    updateData.data[0] = newValue;
  } 
  
  // 2. OT ပြင်ဆင်ခြင်း Logic
  if (colIndex === 4) {
    let rawValue = newValue.trim();
    updateData.data[4] = rawValue;

    // 🎯 "00" ရိုက်ခဲ့လျှင် Off Day သတ်မှတ်ပြီး daily_pay ကို 0 လုပ်မည့် နေရာ
    if (rawValue === "00" || rawValue === "0") {
      updateData.data[2] = "OFF DAY";
      updateData.data[4] = "0";
      updateData.data[5] = "฿0.00"; // ot_pay
      updateData.data[6] = "฿0.00"; // daily_pay
    } else {
      // ပုံမှန် OT ရှိလျှင် ပုံမှန်အတိုင်း ပြန်တွက်ချက်မည်
      updateData.data[2] = "NORMAL"; // သို့မဟုတ် ပုံမှန် အချိန်ဆင်းချိန်
      let ot = parseFloat(rawValue) || 0;
      let calculatedPay = CONFIG.dayPay + (ot * CONFIG.otPayRate);
      
      updateData.data[5] = "฿" + (ot * CONFIG.otPayRate).toFixed(2);
      updateData.data[6] = "฿" + calculatedPay.toFixed(2);
    }
  }

  // 3. Supabase Database သို့ ဒေတာ အလိုအလျောက် သွားသိမ်းခြင်း
  try {
    let rowId = updateData.id; 
    let { error } = await supabaseClient
      .from('salary_data') // ⚠️ မိမိရဲ့ Supabase Table အမည် မှန်အောင် ပြန်ထည့်ပေးပါဗျာ
      .update({ data: updateData.data })
      .eq('id', rowId);

    if (error) throw error;
    
    showToast("💾 ဒေတာကို အလိုအလျောက် အပ်ဒိတ်လုပ်ပြီးပါပြီ");
    renderTable(); // ဇယားကို ပြန်ဆွဲပြီး update ဖြစ်သွားသော တန်ဖိုးများ ပြပေးမည်
  } catch (err) {
    console.error("Error updating cell:", err);
    showToast("❌ ဒေတာအပ်ဒိတ်လုပ်ရာတွင် အမှားအယွင်းရှိနေပါသည်");
  }
}
function showTab(tab){
  let t1 = document.getElementById("tab1");
  let t2 = document.getElementById("tab2");
  let e = document.getElementById("entrySection");
  let l = document.getElementById("listSection");

  if(tab === 'entry'){
    t1.classList.add("active");
    t2.classList.remove("active");
    e.classList.remove("hidden");
    l.classList.add("hidden");
  } else {
    t2.classList.add("active");
    t1.classList.remove("active");
    l.classList.remove("hidden"); // hidden ကို ဖြုတ်ပြီး ပြသမည်
    e.classList.add("hidden");
    
    loadData();
  }
}

async function exportPdf(){

  let year = new Date().getFullYear();

  pdf.setFontSize(18);
  pdf.setTextColor(0, 102, 204);
  pdf.text(month + " " + year, 105, 12, {align:"center"});

  let totalOt = document.getElementById("total14Ot").innerText;
  let totalPay = document.getElementById("total14Pay").innerText.replace("฿","Baht ");

  pdf.setDrawColor(200);
  pdf.setFillColor(240, 248, 255);
  pdf.roundedRect(10, startY, 190, 12, 3, 3, "F");

  pdf.setTextColor(0);
  pdf.setFontSize(11);
  pdf.text("Total OT: " + totalOt, 15, startY + 8);
  pdf.text("Total Pay: " + totalPay, 130, startY + 8);

  startY += 18;

  let start = currentPage * 14;
  let pageData = currentMonthData.slice(start, start + 14);

  if(pageData.length > 0){
    let firstDate = pageData[0].data[0];
    let lastDate = pageData[pageData.length - 1].data[0];
    pdf.setFontSize(11);
    pdf.setTextColor(120);
    pdf.text("Date: " + firstDate + "  to  " + lastDate, 105, startY, {align:"center"});
    startY += 10;
  }

  pdf.setFillColor(0, 102, 204);
  pdf.setTextColor(255);
  pdf.rect(10, startY, 190, 8, "F");
  pdf.text("DATE", 15, startY + 5.5);
  pdf.text("OT", 85, startY + 5.5);
  pdf.text("PAY", 130, startY + 5.5);
  startY += 10;

  let logo = new Image();
  logo.src = "https://i.postimg.cc/4KyyNxHX/Logo.png";
  await new Promise(resolve => { logo.onload = resolve; });

  pdf.setGState(new pdf.GState({opacity: 0.08}));
  pdf.addImage(logo, "PNG", 55, 100, 100, 100);
  pdf.setGState(new pdf.GState({opacity: 1}));
  pdf.setTextColor(0);

  pageData.forEach((it, index)=>{
    let r = it.data;
    let date = r.data;
    let isOff = r[1] === "OFF DAY" || r[2] === "OFF DAY";
    let ot = isOff ? "OFF" : r[4] + " hr";
    let pay = isOff ? "OFF DAY" : r[6].replace("฿","") + " Baht";

    if(index % 2 == 0){
      pdf.setFillColor(245,245,245);
      pdf.rect(10, startY - 4, 190, 8, "F");
    }
    if(isOff){ pdf.setTextColor(200,0,0); }else{ pdf.setTextColor(0); }

    pdf.text(date.toString(), 15, startY);
    pdf.text(ot.toString(), 85, startY);
    pdf.text(pay.toString(), 130, startY);
    startY += 8;
  });
  pdf.save(month + "_KYOE SAR THU.pdf");
}

        <img id="modalProfilePic" src="https://i.postimg.cc/L473n1hp/Logo.png" class="w-full h-full object-cover">
      </div>
      <label class="bg-cyan-900/40 hover:bg-cyan-900 text-cyan-400 text-[10px] px-2.5 py-1 rounded-md cursor-pointer font-bold border border-cyan-500/20">
        Upload Photo
        <input type="file" id="profileUpload" accept="image/*" class="hidden" onchange="uploadProfilePic(this)">
      </label>
    </div>

    <div class="bg-black/30 p-2 rounded-xl text-center mb-3 border border-white/5">
      <p id="accountStatus" class="text-[11px] font-semibold text-gray-300">Checking...</p>
      <p id="accountEmail" class="text-[10px] text-yellow-400 font-mono mt-0.5 break-all"></p>
    </div>

    <div id="authInputs" class="space-y-2 mb-3">
      <input id="userEmail" class="table-input" placeholder="Email">
      <input id="userPassword" type="password" class="table-input" placeholder="Password">
      <button onclick="loginAccount()" class="w-full bg-cyan-600 text-white p-2 rounded-xl font-bold text-xs">LOGIN</button>
    </div>

    <div class="bg-black/20 p-3 rounded-xl border border-white/5 mb-3">
      <h3 class="text-cyan-400 font-bold text-[10px] mb-2 tracking-wide">⚙️ APP CONFIGURATION</h3>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label class="text-[9px] text-gray-400 block mb-0.5">Day Pay (฿)</label>
          <input type="number" id="cfgDayPay" class="table-input" value="400">
        </div>
        <div>
          <label class="text-[9px] text-gray-400 block mb-0.5">OT Rate (฿/hr)</label>
          <input type="number" id="cfgOtPay" class="table-input" value="50">
        </div>
      </div>
      <div>
        <label class="text-[9px] text-gray-400 block mb-0.5">Salary Start Cycle Day</label>
        <input type="number" id="cfgStartDay" class="table-input" value="21" min="1" max="31">
      </div>
    </div>

    <div class="space-y-2">
      <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-xl font-bold text-xs">
        SAVE SETTINGS
      </button>
      <button onclick="logoutAccount()" class="w-full bg-rose-600 text-white p-2 rounded-xl font-bold text-xs">
        LOGOUT
      </button>
      <button onclick="closeProfile()" class="w-full bg-slate-700 text-white p-2 rounded-xl font-bold text-xs">
        CLOSE
      </button>
    </div>

  </div>
</div>



  
</body>
</html>
