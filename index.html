  }

function showToast(message, type = "success") {
  const toast = document.getElementById("toast");
  if (!toast) return;

  toast.innerHTML = message;

  // အောင်မြင်မှု သို့မဟုတ် အမှားအယွင်းအလိုက် ခေတ်မီပြီး လင်းလက်သော အရောင်များ ပြောင်းလဲခြင်း
  if (type === "error") {
    // အနီရောင် Glow ဒီဇိုင်း
    toast.style.background = "linear-gradient(135deg, #ef4444, #b91c1c)";
    toast.style.boxShadow = "0 10px 25px rgba(239, 68, 68, 0.4)";
    toast.style.border = "1px solid rgba(255, 255, 255, 0.2)";
  } else {
    // အစိမ်းရောင် Glow ဒီဇိုင်း
    toast.style.background = "linear-gradient(135deg, #10b981, #047857)";
    toast.style.boxShadow = "0 10px 25px rgba(16, 185, 129, 0.4)";
    toast.style.border = "1px solid rgba(255, 255, 255, 0.2)";
  }

  // Noti ကို ပြသခြင်း
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  // ၂.၅ စက္ကန့်ပြည့်လျှင် အပေါ်သို့ ပြန်လည် လျှောတက် ပျောက်ကွယ်သွားမည်
  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

function calculate(){
  let endTime = document.getElementById("endTime").value;
  let resOt = document.getElementById("resOt");
  let resTotal = document.getElementById("resTotal");

  if(endTime === "OFF DAY"){
    resOt.innerText="0 hr"; resTotal.innerText="฿0.00"; return;
  }
  if(endTime === "12:00 PM"){
    resOt.innerText="0 hr"; resTotal.innerText="฿200.00"; return;
  }

  let map = {"05:00 PM":9, "06:00 PM":10, "07:00 PM":11, "08:00 PM":12, "09:00 PM":13, "10:00 PM":14};
  let hrs = map[endTime] || 9;
  let ot = hrs > 9 ? hrs - 9 : 0;

  resOt.innerText = ot + " hr";
  resTotal.innerText = "฿" + (400 + ot * 50).toFixed(2);
}

async function loadData(keepPage = false){
  let oldPage = currentPage;
  let month = document.getElementById("monthView").value;

  // လက်ရှိ Supabase အကောင့် ဝင်ထားသူကို စစ်မယ်
  const { data: { user } } = await supabaseClient.auth.getUser();
  
  // အကောင့်မဝင်ရသေးရင် ဒေတာလုံးဝမဆွဲဘဲ ဇယားကို အလွတ်ပဲ ပြထားမယ် (Error မပြတော့ပါ)
  if (!user) {
    currentMonthData = [];
    renderTable();
    return;
  }

  // အကောင့်ရှိမှ မိမိ user_id နဲ့ သက်ဆိုင်တဲ့ ဒေတာကို ဆွဲမယ်
  const { data, error } = await supabaseClient
    .from("salary_data")
    .select("*")
    .eq("user_id", user.id)
    .order("data", { ascending:true });

  if(error){
    console.log(error);
    showToast("Load Error", "error");
    return;
  }

  currentMonthData = data
    .filter(item => {
      let itemMonth = new Date(item.data).toLocaleString("en-US", { month:"long" }).toUpperCase();
      return itemMonth === month;
    })
    .map(item => {
      return {
        rowIndex: item.id,
        data:[
          item.data,
          item.start_time,
          item.end_time,
          item.work_hours,
          item.ot_hours,
          item.ot_pay,
          item.daily_pay
        ]
      };
    });

  if(keepPage){
    currentPage = oldPage;
  }else{
    currentPage = 0;
  }

  renderTable();
}

  
function renderTable() {
  let tOt = 0, tPay = 0;
  let tbody = document.getElementById("dataTableBody");
  if (!tbody) return;
  tbody.innerHTML = "";

  // 1. အကောင့်မဝင်ရသေးရင် LIST ဇယားထဲမှာ စာသားလေးပြပြီး ပေးသွားမည်
  if (currentMonthData.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding: 40px 10px; color: #9ca3af; text-align: center; font-style: italic;">
          🛈 ဒေတာများကြည့်ရှုရန် ပရိုဖိုင် (👤) တွင် အကောင့်ဝင်ပေးပါ
        </td>
      </tr>
    `;
    document.getElementById("total14Ot").innerText = "0 hr";
    document.getElementById("total14Pay").innerText = "฿0.00";
    document.getElementById("dateRangeDisplay").innerText = "ရက်စွဲ - (အကောင့်မဝင်ရသေးပါ)";
    document.getElementById("pageInfo").innerText = "PAGE 1 (0 ခု)";
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    if(document.getElementById("tableLockOverlay")) {
      document.getElementById("tableLockOverlay").style.display = "none";
    }
    return; // အောက်က ကုဒ်တွေကို ဆက်မလုပ်ဘဲ ဒီတင်ရပ်မည်
  }

  // 2. အကောင့်ဝင်ထားရင် ပုံမှန်အတိုင်း ဒေတာများ တွက်ချက်ပြသမည်
  let start = currentPage * 14;
  currentMonthData.sort((a, b) => new Date(a.data[0]) - new Date(b.data[0]));

  let page = currentMonthData.slice(start, start + 14);
 
  if (page.length > 0) {
    let firstDate = page[0].data[0];
    let lastDate = page[page.length - 1].data[0];
    document.getElementById("dateRangeDisplay").innerHTML = 
      "  " + firstDate + " <span style='-webkit-text-fill-color: #9ca3af;'>➔</span> " + lastDate;
  }

  page.forEach(it => {
    let r = it.data;
    let otValue = parseFloat(r[4]) || 0;
    let payStr = r[6] ? r[6].toString() : "0";
    let payValue = parseFloat(payStr.replace('฿', '').replace(',', '')) || 0;

    let otDisplay, payDisplay, rowStyle;

    if (r[2] === "OFF DAY" ) {
      otDisplay = "OFF DAY";
      payDisplay = "အလုပ်ပိတ်ရက်";
      rowStyle = "color: #ffffff; font-style: normal;";
    } else {
      tOt += otValue;
      tPay += payValue;
      otDisplay = r[4] + " hr";
      payDisplay = r[6];
      rowStyle = "color: #facc15; font-weight: bold;";
    }

    tbody.innerHTML += `
      <tr style="border-bottom:0.5px solid rgba(255,255,255,0.08); ${rowStyle}">
        <td style="padding:8px; position:relative;">
          <span onclick="this.nextElementSibling.click()" style="cursor:pointer;">${r[0]}</span>
          <input type="date" value="${r[0]}" 
                 style="position:absolute; opacity:0; width:0; height:0; pointer-events:none;"
                 onchange="updateCell(${it.rowIndex}, 0, this.value)">
        </td>
        <td style="padding:8px;">
          <span contenteditable="true" 
                inputmode="decimal"
                style="display:inline-block; min-width:25px; outline:none;"
                onkeypress="if(event.which==32 || event.which==13) { event.preventDefault(); this.blur(); return false; }"
                onblur="updateCell(${it.rowIndex}, 4, this.innerText)">${r[4]}</span> hr
        </td>
        <td style="padding:8px;">${payDisplay}</td>
        <td style="padding:8px;">
          <button style="color:#ff4d6d" onclick="del(${it.rowIndex})">✕</button>
        </td>
      </tr>`;
  });

  document.getElementById("total14Ot").innerText = tOt + " hr";
  document.getElementById("total14Pay").innerText = "฿" + tPay.toFixed(2);
  document.getElementById("pageInfo").innerText = "PAGE " + (currentPage + 1) + "  (" + page.length + " ခု)";

  document.getElementById("prevBtn").disabled = (currentPage === 0);
  document.getElementById("nextBtn").disabled = ((currentPage + 1) * 14 >= currentMonthData.length);
  applyLockUI();
}

function applyLockUI(){

  let lockOverlay =
  document.getElementById("tableLockOverlay");

  if(!lockOverlay) return;

  let currentPageData =
  currentMonthData.slice(
    currentPage * 14,
    currentPage * 14 + 14
  );

  // ၁၄ရက်ပြည့်မှ lock ခတ်
  if(currentPageData.length >= 14){

    if(isLockedBySystem){
      lockOverlay.style.display = "flex";
    }else{
      lockOverlay.style.display = "none";
    }

  }else{
    lockOverlay.style.display = "none";
  }
}

function handleTableDoubleClick(){

  let currentPageData =
  currentMonthData.slice(
    currentPage * 14,
    currentPage * 14 + 14
  );

  // ၁၄ရက်မပြည့်ရင် မခတ်
  if(currentPageData.length < 14) return;

  isLockedBySystem = !isLockedBySystem;

  applyLockUI();

  if(isLockedBySystem){
    showToast("lock ခတ်လိုက်ပါပြီ","error");
  }else{
    showToast("Lock ဖြုတ်ပြီးပါပြီ");
  }
}

function changePage(step){

  let maxPage =
  Math.ceil(currentMonthData.length / 14) - 1;

  currentPage += step;

  if(currentPage < 0) currentPage = 0;
  if(currentPage > maxPage) currentPage = maxPage;

  isLockedBySystem = true;

  renderTable();
}


async function saveData(){
  const btn = document.getElementById("addBtn");
  btn.disabled = true;
  btn.innerText = "SAVING...";

  // ၁။ လက်ရှိ Login ဝင်ထားတဲ့ User ရဲ့ ID ကို ယူမယ်
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    showToast("ကျေးဇူးပြု၍ အရင် Login ဝင်ပါ", "error");
    btn.disabled = false;
    btn.innerText = "ADD RECORD";
    return;
  }

  let dateValue = document.getElementById("date").value;
  let startVal = document.getElementById("startTime").value;
  let endVal = document.getElementById("endTime").value;

  let map = { "05:00 PM":9, "06:00 PM":10, "07:00 PM":11, "08:00 PM":12, "09:00 PM":13, "10:00 PM":14 };
  let hrs = map[endVal] || 0;
  let isOff = endVal === "OFF DAY";
  let isHalf = endVal === "12:00 PM";
  let ot = hrs > 9 ? hrs - 9 : 0;
  let dailyPay = isOff ? 0 : (isHalf ? 200 : 400 + ot * 50);

  // duplicate check (မိမိအကောင့်ထဲမှာပဲ ဒီရက်စွဲ ရှိမရှိ စစ်တာဖြစ်လို့ .eq("user_id", user.id) ထည့်ရပါမယ်)
  const { data: oldData } = await supabaseClient
    .from("salary_data")
    .select("*")
    .eq("data", dateValue)
    .eq("user_id", user.id);

  if(oldData && oldData.length > 0){
    showToast("ဒီရက်စွဲရှိပြီးသား", "error");
    btn.disabled = false;
    btn.innerText = "ADD RECORD";
    return;
  }

  // ၂။ ဒေတာအသစ်သွင်းတဲ့နေရာမှာ user_id: user.id ကိုပါ ထည့်သွင်းသိမ်းဆည်းပါမယ်
  const { error } = await supabaseClient
    .from("salary_data")
    .insert([{
      user_id: user.id, // 👈 အရေးကြီးဆုံးအချက် - ဒါမှ ဘယ်သူ့ဒေတာလဲဆိုတာ မှတ်ထားမှာပါ
      data: dateValue,
      start_time: startVal,
      end_time: endVal,
      work_hours: isOff ? 0 : (isHalf ? 4 : hrs),
      ot_hours: isOff || isHalf ? 0 : ot,
      ot_pay: "฿" + (ot * 50).toFixed(2),
      daily_pay: "฿" + dailyPay.toFixed(2)
    }]);

  btn.disabled = false;
  btn.innerText = "ADD RECORD";

  if(error){
    console.log(error);
    showToast("Database Save Error", "error");
    return;
  }
  showToast("သိမ်းဆည်းပြီးပါပြီ");
  loadData();
}
  

async function del(i){

if(confirm("Delete?")){

const { error } =
await supabaseClient
  .from("salary_data")
  .delete()
  .eq("id", i);

if(error){

  console.log(error);

  showToast(
    "Delete Error",
    "error"
  );

  return;
}

loadData();

}
}
async function updateCell(
rowIndex,
colIndex,
newValue
){

let columnMap = {
0: "data",
4: "ot_hours"
};

let updateData = {};

updateData[
columnMap[colIndex]
] = newValue;

// OT ပြောင်းရင် daily pay ပြန်တွက်
if(colIndex == 4){

let ot = parseFloat(newValue) || 0;

updateData.daily_pay =
  "฿" + (400 + ot * 50).toFixed(2);

updateData.ot_pay =
  "฿" + (ot * 50).toFixed(2);

}

const { error } =
await supabaseClient
.from("salary_data")
.update(updateData)
.eq("id", rowIndex);

if(error){

console.log(error);

showToast(
  "Update Error",
  "error"
);

return;

}

loadData(true);

showToast(
"ပြင်ပြီးပါပြီ"
);
}

function showTab(tab){
  let t1 = document.getElementById("tab1");
  let t2 = document.getElementById("tab2");
  let e = document.getElementById("entrySection");
  let l = document.getElementById("listSection");

  if(tab === 'entry'){
    t1.classList.add("active");
    t2.classList.remove("active");
    e.classList.remove("hidden");
    l.classList.add("hidden");
  } else {
    t2.classList.add("active");
    t1.classList.remove("active");
    l.classList.remove("hidden");
    e.classList.add("hidden");
    
    // ဇယားကို ဒေတာရှိရှိ မရှိရှိ ဆွဲခိုင်းလိုက်မယ် (ဂျမ်းမဖြစ်တော့ပါ)
    renderTable();
  }
}

async function exportPdf(){
  // jsPDF Library ကို အမှန်ကန်ဆုံး လှမ်းယူခြင်း
  const { jsPDF } = window.jspdf;
  let pdf = new jsPDF("p", "mm", "a4");
  let startY = 20;

  pdf.setFontSize(18);
  pdf.text("KYOE SAR THU", 105, 12, {align:"center"});

  let start = currentPage * 14;
  let pageData = currentMonthData.slice(start, start + 14);

  pageData.forEach(it=>{
    let r = it.data;
    pdf.text(r[0], 20, startY);
    pdf.text(r[4] + " hr", 90, startY);
    pdf.text(r[6], 140, startY);
    startY += 10;
  });

  pdf.save("KYOE_SAR_THU.pdf");
}
